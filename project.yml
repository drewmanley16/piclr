name: PickleballAI
options:
  bundleIdPrefix: com.pickleball
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  PhoneNumberKit:
    url: https://github.com/PhoneNumberKit/PhoneNumberKit
    from: "5.0.4"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.66.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "128"
    DEVELOPMENT_TEAM: "X9H68STU8F"
    CODE_SIGN_STYLE: Automatic
# Explicit scheme (replaces the auto-generated one) so the run action can attach
# the local StoreKit configuration file — simulator purchases test against
# PickleballAI.storekit instead of App Store Connect. Archive stays Release for
# scripts/testflight.sh.
schemes:
  PickleballAI:
    build:
      targets:
        PickleballAI: all
    run:
      config: Debug
      storeKitConfiguration: PickleballAI/PickleballAI.storekit
    archive:
      config: Release

targets:
  PickleballAI:
    type: application
    platform: iOS
    sources:
      # The .storekit file is a local-testing fixture referenced by the run
      # scheme — keep it in the project but out of the app bundle.
      - path: PickleballAI
        excludes:
          - PickleballAI.storekit
          # Stray tool config (e.g. a .claude/ dir from running Claude Code
          # inside this folder) must never ship in the app bundle.
          - ".claude"
      - path: PickleballAI/PickleballAI.storekit
        buildPhase: none
      # Live-game score model + WC contract, shared with the watch target.
      - Shared
    dependencies:
      - package: PhoneNumberKit
        product: PhoneNumberKit
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: PostHog
        product: PostHog
      - target: PickleballAIWidget
      - target: PickleballAIWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pickleball.ai
        PRODUCT_NAME: PickleballAI
        CODE_SIGN_ENTITLEMENTS: PickleballAI/PickleballAI.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "piclr"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: PickleballAI/Info.plist
      properties:
        # INFOPLIST_KEY_CFBundleDisplayName (settings.base above) has no effect
        # with a checked-in info.path — that build-setting-to-plist synthesis
        # only happens with GENERATE_INFOPLIST_FILE=YES. The literal key here
        # is what actually lands in the compiled Info.plist.
        CFBundleDisplayName: "piclr"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Enable Live Activities (session lock-screen timer).
        NSSupportsLiveActivities: true
        # Required: without this iOS letterboxes the app to a legacy size.
        UILaunchScreen: {}
        # Skip the export-compliance prompt on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # Portrait-only phone app (required for App Store validation).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSContactsUsageDescription: "pickleball.ai uses your contacts to find friends already using the app. Contacts are matched once and are not stored."
        NSLocationWhenInUseUsageDescription: "pickleball.ai uses your location to find pickleball courts near you when logging a session."
        NSHealthShareUsageDescription: "pickleball.ai reads workout heart rate and active calories so they can be included with sessions you post."
        NSHealthUpdateUsageDescription: "pickleball.ai saves pickleball workouts recorded with Apple Watch to Apple Health."

  PickleballAIWidget:
    type: app-extension
    platform: iOS
    sources:
      - PickleballAIWidget
      - path: PickleballAI/LiveActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pickleball.ai.widget
        PRODUCT_NAME: PickleballAIWidget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "piclr"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: PickleballAIWidget/Info.plist
      properties:
        # App extensions must carry an explicit display name for App Store upload.
        CFBundleDisplayName: "piclr"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Tethered watch companion: a tap-to-score controller. The phone owns auth,
  # Supabase networking, and posting; the watch accumulates points locally and
  # syncs LiveMatchScore snapshots over WatchConnectivity.
  PickleballAIWatch:
    type: application
    platform: watchOS
    sources:
      - PickleballAIWatch
      # Same shared model + WC contract compiled into the iOS app above.
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pickleball.ai.watchapp
        PRODUCT_NAME: PickleballAIWatch
        CODE_SIGN_ENTITLEMENTS: PickleballAIWatch/PickleballAIWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_CFBundleDisplayName: "piclr"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: PickleballAIWatch/Info.plist
      properties:
        CFBundleDisplayName: "piclr"
        CFBundleIconName: AppIcon
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.pickleball.ai
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "pickleball.ai reads heart rate and active calories during your pickleball workout."
        NSHealthUpdateUsageDescription: "pickleball.ai saves your completed pickleball workout to Apple Health."
